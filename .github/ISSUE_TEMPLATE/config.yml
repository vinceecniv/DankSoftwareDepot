blank_issues_enabled: true
contact_links:
  - name: A bug in the shell itself
    url: https://github.com/AvengeMedia/DankMaterialShell/issues
    about: >
      This is a plugin. The bar, the settings window, the update daemon and
      the polkit prompts are DankMaterialShell's, and are best reported there.
  - name: A security issue
    url: https://github.com/vinceecniv/DankSoftwareDepot/security/advisories/new
    about: >
      Please report it privately rather than in a public issue. See
      SECURITY.md for what is in scope.
